<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Lookup</title>
    <style>
        /* ... existing styles ... */
        .device-history {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .device-entry {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .device-id {
            color: #666;
            font-family: monospace;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <h1>Receipt Lookup</h1>
    <div>
        <label for="receipt-id">Receipt ID:</label>
        <input type="text" id="receipt-id" name="receipt-id">
        <button onclick="searchReceipt()">Search Receipt</button>
    </div>

    <div id="receipt-details" style="display: none;">
        <h2>Receipt Details</h2>
        <p><strong>Store:</strong> <span id="store"></span></p>
        <p><strong>Date:</strong> <span id="date"></span></p>
        <p><strong>Total:</strong> $<span id="total"></span></p>

        <div class="items-section">
            <h3>Items:</h3>
            <div id="items-list"></div>
        </div>

        <div class="transaction-details">
            <h3>Transaction Details:</h3>
            <p><strong>Transaction ID:</strong> <span id="transaction-id"></span></p>
            <p><strong>Payment Method:</strong> <span id="payment-method"></span></p>
        </div>

        <div class="device-history">
            <h3>Device History:</h3>
            <div id="device-list"></div>
        </div>
    </div>

    <script>
        async function searchReceipt() {
            const receiptId = document.getElementById('receipt-id').value;
            try {
                const response = await fetch(`/api/receipt/${receiptId}/transaction`);
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    return;
                }

                // Display receipt details
                document.getElementById('receipt-details').style.display = 'block';
                document.getElementById('store').textContent = data.receipt.store;
                document.getElementById('date').textContent = data.receipt.timestamp;
                document.getElementById('total').textContent = data.receipt.total.toFixed(2);
                document.getElementById('transaction-id').textContent = data.transaction_id;
                document.getElementById('payment-method').textContent = data.payment_method;

                // Display items
                const itemsList = document.getElementById('items-list');
                itemsList.innerHTML = data.receipt.items.map(item => 
                    `<div class="item">
                        <span>${item.name}</span>
                        <span>$${item.price.toFixed(2)}</span>
                    </div>`
                ).join('');

                // Display device history
                const deviceList = document.getElementById('device-list');
                if (data.scans && data.scans.length > 0) {
                    deviceList.innerHTML = data.scans.map(scan => 
                        `<div class="device-entry">
                            <div>
                                Device: ${scan.device_info.model || 'Unknown Device'}
                                <span class="device-id">ID: ${scan.device_uid ? scan.device_uid.substr(0, 8) + '...' : 'N/A'}</span>
                            </div>
                            <div class="timestamp">${scan.timestamp}</div>
                        </div>`
                    ).join('');
                } else {
                    deviceList.innerHTML = '<div class="device-entry">No scans recorded</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error fetching receipt details');
            }
        }
    </script>
</body>
</html>
